<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content - Studio</title>
    <script>
      (() => {
        const storageKey = "studio-theme";
        const migrationKey = "studio-theme-light-default-v1";
        const root = document.documentElement;
        let theme = "light";
        try {
          if (localStorage.getItem(migrationKey) !== "complete") {
            localStorage.setItem(storageKey, theme);
            localStorage.setItem(migrationKey, "complete");
          } else {
            const savedTheme = localStorage.getItem(storageKey);
            theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : "light";
          }
        } catch (error) {}
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --color-bg-page: #fafbfc;
        --color-bg-header: #ffffff;
        --color-bg-surface: #ffffff;
        --color-bg-elevated: #ffffff;
        --color-bg-subtle: #f6f7f8;
        --color-bg-selected: #e8ebee;
        --color-text-primary: #0b0d0f;
        --color-text-secondary: #71717a;
        --color-text-muted: #52525b;
        --color-text-disabled: #a1a1aa;
        --color-text-inverse: #ffffff;
        --color-border-default: #edf0f2;
        --color-border-subtle: #d4d7dc;
        --color-brand-primary: #1cc749;
        --color-brand-hover: #19b342;
        --color-brand-active: #169f3a;
        --color-status-success-bg: #eef9f1;
        --color-mask: rgba(11, 13, 15, 0.72);
        --color-overlay-modal: rgba(11, 13, 15, 0.45);
        --color-shadow: rgba(20, 23, 26, 0.08);
        --brand: var(--color-brand-primary);
        --brand-600: var(--color-brand-active);
        --text: var(--color-text-primary);
        --muted: var(--color-text-secondary);
        --line: var(--color-border-default);
        --surface: var(--color-bg-surface);
        --page: var(--color-bg-page);
        --nav-hover: var(--color-bg-subtle);
        --nav-active: var(--color-bg-selected);
        --focus: none;
        --radius: 6px;
        --content-toolbar-height: 136px;
        --workspace-x: 28px;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        background-color: #000000;
        --color-bg-page: #000000;
        --color-bg-header: #080808;
        --color-bg-surface: #111111;
        --color-bg-elevated: #171717;
        --color-bg-subtle: #1f1f1f;
        --color-bg-selected: #292929;
        --color-text-primary: #f5f5f5;
        --color-text-secondary: #a3a3a3;
        --color-text-muted: #d4d4d4;
        --color-text-disabled: #666666;
        --color-text-inverse: #0a0a0a;
        --color-border-default: #262626;
        --color-border-subtle: #3d3d3d;
        --color-brand-primary: #1cc749;
        --color-brand-hover: #2ed45c;
        --color-brand-active: #80e69b;
        --color-status-success-bg: rgba(28, 199, 73, 0.14);
        --color-mask: rgba(0, 0, 0, 0.66);
        --color-shadow: rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: #fafbfc;
        background: var(--page);
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #000000;
        background: var(--color-bg-page);
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font-family: "Inter var", "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      html.is-resizing *,
      html.is-resizing *::before,
      html.is-resizing *::after {
        transition: none !important;
      }

      html[data-theme="dark"].is-resizing,
      html[data-theme="dark"].is-resizing body,
      html[data-theme="dark"].is-resizing .shell,
      html[data-theme="dark"].is-resizing .workspace,
      html[data-theme="dark"].is-resizing .workspace-inner,
      html[data-theme="dark"].is-resizing .content-view {
        background: var(--color-bg-page);
      }

      html[data-theme="dark"].is-resizing .content-toolbar-frame,
      html[data-theme="dark"].is-resizing .content-toolbar-frame::before {
        background: var(--color-bg-page);
      }

      html[data-theme="dark"].is-resizing .video-list-card,
      html[data-theme="dark"].is-resizing .video-list-header-scroll,
      html[data-theme="dark"].is-resizing .video-list-header,
      html[data-theme="dark"].is-resizing .video-list-table,
      html[data-theme="dark"].is-resizing .video-list-body,
      html[data-theme="dark"].is-resizing .video-row {
        background: var(--color-bg-surface);
      }

      button,
      a {
        font: inherit;
      }

      .topbar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 100;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .brand-logo-link {
        display: inline-flex;
        align-items: center;
        border-radius: 4px;
      }

      .brand-logo-link:focus-visible {
        outline: none;
      }

      .brand-logo {
        display: block;
        width: auto;
        height: 20px;
        object-fit: contain;
        object-position: left center;
      }

      .brand-title {
        transform: translateY(2.5px);
        font-size: 20px;
        line-height: 28px;
        font-weight: 500;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .language-switch,
      .theme-switch {
        position: relative;
        display: inline-flex;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: #60646c;
        cursor: pointer;
      }

      .icon-button:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .theme-icon {
        width: 20px;
        height: 20px;
      }

      html[data-theme="light"] .theme-icon-sun,
      html[data-theme="dark"] .theme-icon-moon {
        display: none;
      }

      .language-trigger:focus-visible,
      .language-switch.is-open .language-trigger {
        border-color: var(--brand);
      }

      .language-tooltip,
      .theme-tooltip {
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        z-index: 30;
        padding: 5px 8px;
        border-radius: 4px;
        background: rgba(11, 13, 15, 0.72);
        color: #ffffff;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -2px);
        transition: opacity 120ms ease 250ms, transform 120ms ease 250ms;
      }

      .language-switch:hover .language-tooltip,
      .theme-switch:hover .theme-tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .language-switch.is-open .language-tooltip,
      .language-switch.suppress-tooltip .language-tooltip,
      .language-switch.tooltip-muted .language-tooltip,
      .theme-switch.tooltip-muted .theme-tooltip,
      .theme-switch.suppress-tooltip .theme-tooltip {
        opacity: 0;
        transform: translate(-50%, -2px);
        transition-delay: 0ms;
      }

      .account-entry {
        position: relative;
        display: inline-flex;
      }

      .account-tooltip {
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        z-index: 30;
        padding: 5px 8px;
        border-radius: 4px;
        background: rgba(11, 13, 15, 0.72);
        color: #ffffff;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -2px);
        transition: opacity 120ms ease 250ms, transform 120ms ease 250ms;
      }

      .account-entry:hover .account-tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .account-entry.is-open .account-tooltip,
      .account-entry.tooltip-muted .account-tooltip,
      .account-entry.suppress-tooltip .account-tooltip {
        opacity: 0;
        transform: translate(-50%, -2px);
        transition-delay: 0ms;
      }

      .account-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 40;
        min-width: 224px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(20, 23, 26, 0.08);
      }

      .account-menu[hidden] {
        display: none;
      }

      .account-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 10px 10px;
        border-radius: 4px;
      }

      .account-profile-avatar-wrap {
        position: relative;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 999px;
        overflow: hidden;
      }

      .account-profile-avatar {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
      }

      .account-profile-avatar-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(11, 13, 15, 0.64);
        color: #ffffff;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      .account-profile-avatar-overlay .icon {
        width: 18px;
        height: 18px;
        stroke-width: 2;
      }

      .account-profile:hover {
        background: #f6f7f8;
      }

      .account-profile:focus-within {
        background: var(--surface);
      }

      .account-profile:hover .account-profile-avatar-overlay,
      .account-profile:focus-within .account-profile-avatar-overlay {
        opacity: 1;
      }

      .account-profile-copy {
        min-width: 0;
      }

      .account-profile-name {
        margin: 0;
        color: var(--text);
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }

      .account-profile-id {
        margin: 0;
        color: var(--text);
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
      }

      .account-menu-divider {
        height: 1px;
        margin: 6px 0;
        background: var(--line);
      }

      .account-option {
        width: 100%;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-align: left;
      }

      .account-option .icon {
        width: 18px;
        height: 18px;
        stroke-width: 2;
      }

      .account-option:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .account-option.sign-out {
        color: var(--text);
      }

      .language-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 40;
        min-width: 132px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(20, 23, 26, 0.08);
      }

      .language-menu[hidden] {
        display: none;
      }

      .language-option {
        width: 100%;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #3f3f46;
        cursor: pointer;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-align: left;
      }

      .language-option:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .language-option[aria-selected="true"] {
        background: #eef9f1;
        color: var(--brand-600);
        font-weight: 500;
      }

      .language-option[aria-selected="true"]:hover {
        background: #e4f6eb;
        color: var(--brand-600);
      }

      .avatar-button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid #edf0f2;
        border-radius: 999px;
        background: var(--surface);
        cursor: pointer;
      }

      .avatar-button:focus-visible,
      .icon-button:focus-visible,
      .upload-button:focus-visible,
      .nav-link:focus-visible {
        outline: none;
      }

      .avatar-button:focus-visible,
      .icon-button:focus-visible,
      .upload-button:focus-visible {
        border-color: var(--brand);
      }

      .avatar {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
      }

      .sidebar {
        position: fixed;
        top: 64px;
        bottom: 0;
        left: 0;
        z-index: 90;
        width: 240px;
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 20px 16px;
        background: var(--surface);
        border-right: 1px solid var(--line);
      }

      .upload-button {
        width: 100%;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: var(--radius);
        background: var(--brand);
        color: #ffffff;
        font-size: 15px;
        line-height: 20px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 24px;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .upload-button:hover {
        background: #19b342;
        box-shadow: 0 10px 22px rgba(28, 199, 73, 0.24);
      }

      .upload-button:active {
        transform: translateY(1px);
      }

      .nav-list {
        display: grid;
        row-gap: 0;
        column-gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .nav-list::-webkit-scrollbar {
        display: none;
      }

      .nav-link {
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-radius: var(--radius);
        color: rgb(113, 113, 122);
        text-decoration: none;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        transition: background 120ms ease, color 120ms ease, transform 120ms ease;
      }

      .nav-link:hover {
        background: var(--nav-hover);
        color: var(--text);
      }

      .nav-link:active {
        background: var(--nav-active);
        color: #14171a;
        transform: translateY(1px);
      }

      .nav-link[aria-current="page"] {
        background: var(--nav-active);
        color: #14171a;
        font-weight: 500;
      }

      .icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .shell {
        height: 100%;
        padding: 64px 0 0 240px;
      }

      .workspace {
        height: 100%;
        overflow: auto;
        padding: 20px var(--workspace-x) 28px;
        scrollbar-gutter: stable;
        scrollbar-color: var(--color-border-subtle) var(--page);
        scrollbar-width: thin;
      }

      .workspace::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }

      .workspace::-webkit-scrollbar-track {
        background: var(--page);
      }

      .workspace::-webkit-scrollbar-thumb {
        border: 3px solid var(--page);
        border-radius: 999px;
        background: var(--color-border-subtle);
      }

      .workspace-inner {
        min-height: 460px;
        display: grid;
        align-content: start;
        row-gap: 0;
        column-gap: 0;
        padding: 0;
      }

      .content-toolbar-frame {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        row-gap: 20px;
        column-gap: 20px;
        margin: 0 calc(var(--workspace-x) * -1);
        padding: 16px var(--workspace-x);
        background: var(--page);
      }

      .content-toolbar-frame::before {
        content: "";
        position: absolute;
        right: 0;
        bottom: 100%;
        left: 0;
        height: 20px;
        background: var(--page);
        pointer-events: none;
      }

      .content-menu {
        position: relative;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 28px;
        min-width: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .content-menu::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 1px;
        background: var(--line);
      }

      .content-menu-link {
        position: relative;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: #71717a;
        cursor: pointer;
        text-decoration: none;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
        white-space: nowrap;
      }

      .content-menu-link:hover {
        color: var(--text);
      }

      .content-menu-link[aria-selected="true"] {
        color: #14171a;
        font-weight: 500;
      }

      .content-menu-link[aria-selected="true"]::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1;
        height: 2px;
        border-radius: 999px;
        background: var(--brand);
      }

      .content-menu-link:focus-visible {
        outline: none;
      }

      .content-view {
        min-width: 0;
        display: grid;
        gap: 16px;
        margin-top: 0;
        padding-bottom: 120px;
      }

      .content-panel[hidden] {
        display: none;
      }

      .content-filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .filter-group {
        position: relative;
        display: inline-flex;
      }

      .filter-control,
      .search-control {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: #3f3f46;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }

      .filter-control {
        gap: 6px;
        padding: 0 10px;
        cursor: pointer;
      }

      .filter-control .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }

      .filter-control:hover {
        background: #f6f7f8;
      }

      .filter-control:focus-visible,
      .search-control:focus-within,
      .row-action:focus-visible {
        outline: none;
      }

      .filter-control:focus-visible,
      .filter-control[aria-expanded="true"],
      .search-control:focus-within,
      .row-action:focus-visible {
        border-color: var(--brand);
      }

      .filter-label {
        flex: 0 0 auto;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
      }

      .filter-value {
        min-width: 0;
        display: inline-flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: flex-end;
        color: var(--text);
        font-weight: 500;
        white-space: nowrap;
      }

      .filter-control[data-filter-field="publicationStatus"] .filter-value {
        justify-content: flex-end;
      }

      .filter-control[data-filter-field="publicationStatus"] .filter-value .status-pill {
        width: auto;
      }

      .filter-control[data-filter-field="publicationStatus"] .filter-value .status-pill .icon {
        color: inherit;
      }

      .filter-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 50;
        min-width: 156px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(20, 23, 26, 0.08);
      }

      .filter-menu[hidden] {
        display: none;
      }

      .filter-option {
        width: 100%;
        min-height: 34px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: rgb(113, 113, 122);
        cursor: pointer;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-align: left;
      }

      .filter-option:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .filter-option[aria-selected="true"] {
        color: #14171a;
      }

      .search-control {
        flex: 0 0 300px;
        margin-left: auto;
        width: 300px;
        max-width: 100%;
        padding: 0 10px;
      }

      .search-control:hover {
        background: #f6f7f8;
      }

      .search-control:focus-within {
        background: var(--surface);
      }

      .search-control .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }

      .search-input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 500;
      }

      .search-input::placeholder {
        color: #a1a1aa;
        font-weight: 500;
      }

      .search-input::-webkit-search-cancel-button {
        display: none;
      }

      .search-clear {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .search-clear:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .search-clear:focus-visible {
        outline: none;

          container.classList.remove("tooltip-muted");
        });
      }

      tooltipContainers.forEach((container) => {
        container.addEventListener("pointerenter", () => {
          setActiveTooltipContainer(container);
        });
        container.addEventListener("focusin", () => {
          setActiveTooltipContainer(container);
        });
        container.addEventListener("pointerleave", () => {
          container.classList.remove("suppress-tooltip");
          if (!tooltipContainers.some((item) => item.matches(":hover"))) {
            clearTooltipContainerMutes();
          }
        });
        container.addEventListener("focusout", (event) => {
          if (!container.contains(event.relatedTarget)) {
            container.classList.remove("suppress-tooltip");
            if (!tooltipContainers.some((item) => item.contains(event.relatedTarget))) {
              clearTooltipContainerMutes();
            }
          }
        });
      });

      function positionFilterMenu(filterTrigger) {
        const filterMenu = filterTrigger?.closest(".filter-group")?.querySelector(".filter-menu");
        if (!filterMenu || filterMenu.hidden) return;
        if (window.innerWidth < 768 || window.innerWidth >= 1280) {
          filterMenu.style.removeProperty("left");
          filterMenu.style.removeProperty("top");
          return;
        }
        const triggerRect = filterTrigger.getBoundingClientRect();
        const menuRect = filterMenu.getBoundingClientRect();
        const left = Math.max(8, Math.min(window.innerWidth - menuRect.width - 8, triggerRect.left));
        filterMenu.style.left = `${left}px`;
        filterMenu.style.top = `${triggerRect.bottom + 6}px`;
      }

      function positionOpenFilterMenu() {
        const openTrigger = filterTriggers.find((item) => item.getAttribute("aria-expanded") === "true");
        if (openTrigger) positionFilterMenu(openTrigger);
      }

      function closeFilterMenus() {
        filterTriggers.forEach((filterTrigger) => {
          filterTrigger.setAttribute("aria-expanded", "false");
          const filterMenu = filterTrigger.closest(".filter-group").querySelector(".filter-menu");
          filterMenu.hidden = true;
          filterMenu.style.removeProperty("left");
          filterMenu.style.removeProperty("top");
        });
      }

      function closePageSizeMenu() {
        pageSizeSelect.classList.remove("open");
        pageSizeTrigger.setAttribute("aria-expanded", "false");
        pageSizeMenu.hidden = true;
      }

      function syncSearchClear() {
        searchClear.hidden = !searchInput.value;
      }

      function applySearch() {
        syncSearchClear();
        currentPage = 1;
        renderVideoList(currentContentView);
        syncStickyDivider();
      }

      searchInput.addEventListener("input", applySearch);

      searchClear.addEventListener("click", (event) => {
        event.preventDefault();
        searchInput.value = "";
        applySearch();
        searchInput.focus();
      });

      filterTriggers.forEach((filterTrigger) => {
        filterTrigger.addEventListener("click", (event) => {
          event.stopPropagation();
          closeDateRangePicker();
          const group = filterTrigger.closest(".filter-group");
          const filterMenu = group.querySelector(".filter-menu");
          const shouldOpen = filterMenu.hidden;
          closeFilterMenus();
          filterMenu.hidden = !shouldOpen;
          filterTrigger.setAttribute("aria-expanded", String(shouldOpen));
          if (shouldOpen) positionFilterMenu(filterTrigger);
          closePageSizeMenu();
          menu.hidden = true;
          languageSwitch.classList.remove("is-open");
          trigger.setAttribute("aria-expanded", "false");
          accountMenu.hidden = true;
          accountEntry.classList.remove("is-open");
          accountTrigger.setAttribute("aria-expanded", "false");
        });
      });

      contentFilters.addEventListener("scroll", () => {
        positionOpenFilterMenu();
        positionDateRangeOverlay();
      }, { passive: true });
      window.addEventListener("scroll", positionOpenFilterMenu, true);

      filterOptions.forEach((filterOption) => {
        filterOption.addEventListener("click", (event) => {
          event.stopPropagation();
          const field = filterOption.dataset.filterField;
          activeFilters[field] = filterOption.dataset.filterValue;
          filterOptions
            .filter((option) => option.dataset.filterField === field)
            .forEach((option) => {
              option.setAttribute("aria-selected", String(option === filterOption));
            });
          const group = filterOption.closest(".filter-group");
          syncFilterLabels();
          closeFilterMenus();
          currentPage = 1;
          renderVideoList(currentContentView);
          syncStickyDivider();
        });
      });

      trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        closeDateRangePicker();
        const isOpen = !menu.hidden;
        languageSwitch.classList.add("suppress-tooltip");
        setActiveTooltipContainer(languageSwitch);
        if (!isOpen) {
          suppressTooltipIfHidden(languageSwitch, ".language-tooltip");
        }
        menu.hidden = isOpen;
        languageSwitch.classList.toggle("is-open", !isOpen);
        trigger.setAttribute("aria-expanded", String(!isOpen));
        accountMenu.hidden = true;
        accountEntry.classList.remove("is-open");
        accountTrigger.setAttribute("aria-expanded", "false");
        closeFilterMenus();
      });

      options.forEach((option) => {
        option.addEventListener("click", () => {
          languageSwitch.classList.add("suppress-tooltip");
          setLanguage(option.dataset.lang);
          menu.hidden = true;
          languageSwitch.classList.remove("is-open");
          trigger.setAttribute("aria-expanded", "false");
          trigger.blur();
          option.blur();
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".date-range-overlay") && !event.target.closest("[data-date-filter]")) {
          closeDateRangePicker();
        }
        if (!event.target.closest(".language-switch")) {
          menu.hidden = true;
          languageSwitch.classList.remove("is-open");
          trigger.setAttribute("aria-expanded", "false");
        }
        if (!event.target.closest(".account-entry")) {
          accountMenu.hidden = true;
          accountEntry.classList.remove("is-open");
          accountTrigger.setAttribute("aria-expanded", "false");
        }
        if (!event.target.closest(".content-filters")) {
          closeFilterMenus();
        }
      });

      accountTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        closeDateRangePicker();
        const isOpen = !accountMenu.hidden;
        accountEntry.classList.add("suppress-tooltip");
        setActiveTooltipContainer(accountEntry);
        if (!isOpen) {
          suppressTooltipIfHidden(accountEntry, ".account-tooltip");
        }
        accountMenu.hidden = isOpen;
        accountEntry.classList.toggle("is-open", !isOpen);
        accountTrigger.setAttribute("aria-expanded", String(!isOpen));
        menu.hidden = true;
        languageSwitch.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
        closeFilterMenus();
      });


      function getVideoRows(view) {
        return [...videoItems].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)).filter((item) => {
          const query = searchInput.value.trim().toLowerCase();
          return !query || item.title.toLowerCase().includes(query) || item.id.includes(query.replace(/^id[：:]\s*/, ""));
        }).filter((item) => {
          return Object.entries(dateFilters).every(([field, range]) => {
            if (!range.start || !range.end) return true;
            if (!item[field]) return false;
            const date = item[field].slice(0, 10);
            return date >= range.start && date <= range.end;
          });
        }).filter((item) =>
          Object.entries(activeFilters).every(([field, value]) => {
            if (!value) return true;
            if (["freePaidStatus", "publicationStatus", "visibilityStatus"].includes(field)) {
              return getStatusKey(item[field]) === getStatusKey(value);
            }
            return item[field] === value;
          })
        );
      }

      function updatePagination(totalRows) {
        const totalPages = Math.max(1, Math.ceil(totalRows / pageSize));
        currentPage = Math.min(currentPage, totalPages);
        paginationRange.textContent = t("rowsTotal", totalRows);
        if (!totalRows) {
          pageNumbers.innerHTML = "";
          prevPageButton.disabled = true;
          nextPageButton.disabled = true;
          return;
        }
        pageNumbers.innerHTML = Array.from({ length: totalPages }, (_, index) => {
          const page = index + 1;
          return `<button class="pagination-button${page === currentPage ? " current" : ""}" type="button" aria-label="${t("pageLabel", page)}" data-page-number="${page}">${page}</button>`;
        }).join("");
        prevPageButton.disabled = currentPage <= 1;
        nextPageButton.disabled = currentPage >= totalPages;
      }

      function renderVideoList(view) {
        hideReviewTooltip();
        const rows = getVideoRows(view);
        updatePagination(rows.length);
        const visibleRows = rows.slice((currentPage - 1) * pageSize, currentPage * pageSize);
        if (!visibleRows.length) {
          contentList.innerHTML = `<div class="video-empty-state">${t("noContentYet")}</div>`;
          return;
        }
        contentList.innerHTML = visibleRows
          .map((item) => {
            const isReviewing = item.reviewStatus === "Reviewing";
            const isPending = pendingRequests.has(item.id);
            const detailsUrl = `edit.html?contentId=${encodeURIComponent(item.legacyId)}&type=${encodeURIComponent(item.type)}`;
            const requestKey = item.publicationStatus === "Offline" ? "requestOnline" : "requestOffline";
            const requestIcon = item.publicationStatus === "Offline" ? "online" : "offline";
            const disabledModifyAction = (labelKey, icon) => `<button class="row-action" type="button" disabled>${renderActionIcon(icon)}<span class="row-action-label">${t(labelKey)}</span></button>`;
            const enabledModifyAction = (labelKey, icon) => `<a class="row-action" href="${detailsUrl}">${renderActionIcon(icon)}<span class="row-action-label">${t(labelKey)}</span></a>`;
            return `
              <article class="video-row" data-content-id="${item.id}">
                <div class="video-main">
                  <div class="video-thumb ${item.type}">
                    <span class="video-duration">${getThumbBadgeLabel(item)}</span>
                  </div>
                  <div class="video-copy">
                    <p class="video-title">${item.title}</p>
                    <p class="video-subtitle">ID：${item.id}</p>
                    <div class="video-tags">
                      <span class="type-tag ${item.type}">${getTypeLabel(item.type)}</span>
                    </div>
                  </div>
                </div>
                <span class="status-text">${getStatusLabel(item.freePaidStatus)}</span>
                ${renderPublicationCell(item)}
                <div>
                  <p class="content-time">${item.updatedAt}</p>
                </div>
                <div class="row-actions">
                  ${isReviewing ? disabledModifyAction("viewModifyContent", "info") : enabledModifyAction("viewModifyContent", "info")}
                  <button class="row-action${isPending ? " is-loading" : ""}" type="button" data-publication-request="${item.id}"${isPending ? " disabled" : ""}>
                    ${renderActionIcon(isPending ? "loading" : requestIcon)}
                    <span class="row-action-label">${t(isPending ? "requestProcessing" : requestKey)}</span>
                  </button>
                </div>
              </article>
            `;
          })
          .join("");
      }

      function syncRequestModalContent() {
        if (!activeRequest) return;
        const isOnlineRequest = activeRequest.targetStatus === "Online";
        requestModalTitle.textContent = t(isOnlineRequest ? "confirmRequestOnline" : "confirmRequestOffline");
        requestModalDescription.replaceChildren();
        const description = document.createElement("p");
        description.textContent = t(isOnlineRequest ? "requestOnlineDescription" : "requestOfflineDescription", activeRequest.item.title);
        requestModalDescription.append(description);
        requestModalConfirm.textContent = t("confirm");
        requestModalCancel.textContent = t("cancel");
        requestModalClose.setAttribute("aria-label", t("closeModal"));
      }

      function openRequestModal(item, triggerNode) {
        if (!item || pendingRequests.has(item.id)) return;
        activeRequest = {
          item,
          targetStatus: item.publicationStatus === "Offline" ? "Online" : "Offline"
        };
        requestReturnFocus = triggerNode;
        syncRequestModalContent();
        requestModalOverlay.classList.add("is-open");
        requestModalOverlay.setAttribute("aria-hidden", "false");
        document.querySelector(".topbar")?.setAttribute("inert", "");
        document.querySelector("main")?.setAttribute("inert", "");
        requestAnimationFrame(() => requestModal.focus());
      }

      function closeRequestModal({ restoreFocus = true } = {}) {
        if (!requestModalOverlay.classList.contains("is-open")) return;
        requestModalOverlay.classList.remove("is-open");
        requestModalOverlay.setAttribute("aria-hidden", "true");
        document.querySelector(".topbar")?.removeAttribute("inert");
        document.querySelector("main")?.removeAttribute("inert");
        const focusTarget = requestReturnFocus;
        activeRequest = null;
        requestReturnFocus = null;
        if (restoreFocus) {
          window.setTimeout(() => {
            if (focusTarget?.isConnected) focusTarget.focus();
          }, 300);
        }
      }

      function showGlobalMessage({ id, type, text, duration = 0 }) {
        let message = messagePortal.querySelector(`[data-message-id="${id}"]`);
        if (!message) {
          message = document.createElement("div");
          message.dataset.messageId = id;
          messagePortal.prepend(message);
        }
        window.clearTimeout(message.closeTimer);
        message.className = `global-message ${type}`;
        const icon = type === "loading"
          ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/><path d="M20 12a8 8 0 0 0-8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
          : '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="m8 12 2.5 2.5L16 9" fill="none" stroke="var(--color-text-inverse)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        message.innerHTML = `${icon}<span></span>`;
        message.querySelector("span").textContent = text;
        message.setAttribute("role", type === "success" ? "status" : "status");
        if (duration > 0) {
          message.closeTimer = window.setTimeout(() => {
            message.classList.add("is-leaving");
            message.addEventListener("animationend", () => message.remove(), { once: true });
          }, duration);
        }
      }

      function completePublicationRequest(item, targetStatus) {
        item.publicationStatus = targetStatus;
        pendingRequests.delete(item.id);
        renderVideoList(currentContentView);
        syncStickyDivider();
        showGlobalMessage({
          id: `publication-${item.id}`,
          type: "success",
          text: t(targetStatus === "Online" ? "onlineSuccess" : "offlineSuccess"),
          duration: 3000
        });
      }

      contentList.addEventListener("click", (event) => {
        const triggerNode = event.target.closest("[data-publication-request]");
        if (!triggerNode || triggerNode.disabled) return;
        const item = videoItems.find((entry) => entry.id === triggerNode.dataset.publicationRequest);
        openRequestModal(item, triggerNode);
      });

      requestModalClose.addEventListener("click", () => closeRequestModal());
      requestModalCancel.addEventListener("click", () => closeRequestModal());
      requestModalConfirm.addEventListener("click", () => {
        if (!activeRequest) return;
        const { item, targetStatus } = activeRequest;
        pendingRequests.set(item.id, targetStatus);
        item.publicationStatus = "Publishing";
        closeRequestModal({ restoreFocus: false });
        renderVideoList(currentContentView);
        syncStickyDivider();
        contentPanel.tabIndex = -1;
        contentPanel.focus({ preventScroll: true });
        showGlobalMessage({
          id: `publication-${item.id}`,
          type: "loading",
          text: t(targetStatus === "Online" ? "requestOnlineProcessing" : "requestOfflineProcessing")
        });
        window.setTimeout(() => completePublicationRequest(item, targetStatus), 1500);
      });

      requestModal.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeRequestModal();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = Array.from(requestModal.querySelectorAll("button:not(:disabled), a[href], [tabindex]:not([tabindex='-1'])"));
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && requestModalOverlay.classList.contains("is-open")) {
          event.preventDefault();
          closeRequestModal();
        }
      });

      function setContentView(nextView) {
        currentContentView = nextView;
        currentPage = 1;
        const selectedTab = contentTabs.find((tab) => tab.dataset.contentTab === nextView) || contentTabs[0];
        contentTabs.forEach((tab) => {
          const isSelected = tab.dataset.contentTab === nextView;
          tab.setAttribute("aria-selected", String(isSelected));
          tab.tabIndex = isSelected ? 0 : -1;
        });
        contentPanel.setAttribute("aria-labelledby", selectedTab.id);
        renderVideoList(nextView);
        syncStickyDivider();
      }

      function isElementRendered(node) {
        return Boolean(node && (node.offsetWidth || node.offsetHeight || node.getClientRects().length));
      }

      let stickyDividerFrame = 0;
      let stickyDividerScrolled = false;
      let stickyDividerScrollLeft = -1;
      let resizeSettledTimer = 0;

      function syncStickyDivider() {
        if (!isElementRendered(videoListScroll)) return;
        const nextScrollLeft = videoListScroll.scrollLeft;
        const nextScrolled = nextScrollLeft > 0;
        if (nextScrolled !== stickyDividerScrolled) {
          stickyDividerScrolled = nextScrolled;
          videoListCard.classList.toggle("is-scrolled-x", nextScrolled);
        }
        if (nextScrollLeft !== stickyDividerScrollLeft) {
          stickyDividerScrollLeft = nextScrollLeft;
          videoListHeaderScroll.scrollLeft = nextScrollLeft;
        }
      }

      function scheduleStickyDividerSync() {
        if (stickyDividerFrame) return;
        stickyDividerFrame = window.requestAnimationFrame(() => {
          stickyDividerFrame = 0;
          syncStickyDivider();
        });
      }

      function handleResponsiveResize() {
        document.documentElement.classList.add("is-resizing");
        window.clearTimeout(resizeSettledTimer);
        resizeSettledTimer = window.setTimeout(() => {
          document.documentElement.classList.remove("is-resizing");
        }, 140);
        scheduleStickyDividerSync();
        positionDateRangeOverlay();
        positionOpenFilterMenu();
      }

      function scrollContentListToTop() {
        const toolbarHeight = Math.ceil(contentToolbar.getBoundingClientRect().height);
        if (workspace && workspace.scrollHeight > workspace.clientHeight) {
          const targetTop = Math.max(
            0,
            workspace.scrollTop + contentPanel.getBoundingClientRect().top - workspace.getBoundingClientRect().top - toolbarHeight
          );
          workspace.scrollTo({ top: targetTop, left: workspace.scrollLeft });
          return;
        }
        window.scrollTo({
          top: Math.max(0, window.scrollY + contentPanel.getBoundingClientRect().top - toolbarHeight),
          left: window.scrollX
        });
      }

      videoListScroll.addEventListener("scroll", scheduleStickyDividerSync, { passive: true });
      window.addEventListener("resize", handleResponsiveResize);
      window.addEventListener("scroll", positionDateRangeOverlay, true);

      pageSizeTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        closeDateRangePicker();
        const shouldOpen = pageSizeMenu.hidden;
        closeFilterMenus();
        pageSizeSelect.classList.toggle("open", shouldOpen);
        pageSizeTrigger.setAttribute("aria-expanded", String(shouldOpen));
        pageSizeMenu.hidden = !shouldOpen;
      });

      pageSizeOptions.forEach((option) => {
        option.addEventListener("click", (event) => {
          event.stopPropagation();
          pageSize = Number(option.dataset.pageSizeOption);
          pageSizeTrigger.dataset.pageSizeValue = option.dataset.pageSizeOption;
          pageSizeOptions.forEach((item) => item.classList.toggle("selected", item === option));
          syncPageSizeLabels();
          currentPage = 1;
          renderVideoList(currentContentView);
          scrollContentListToTop();
          syncStickyDivider();
          closePageSizeMenu();
        });
      });

      pageNumbers.addEventListener("click", (event) => {
        const pageButton = event.target.closest("[data-page-number]");
        if (!pageButton) return;
        currentPage = Number(pageButton.dataset.pageNumber);
        renderVideoList(currentContentView);
        scrollContentListToTop();
        syncStickyDivider();
      });

      pageSizeSelect.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      document.addEventListener("click", closePageSizeMenu);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          const hadOpenDatePicker = Boolean(activeDateGroup);
          const openFilter = filterTriggers.find((item) => item.getAttribute("aria-expanded") === "true");
          closeFilterMenus();
          if (openFilter) openFilter.focus();
          closePageSizeMenu();
          if (hadOpenDatePicker) closeDateRangePicker({ returnFocus: true });
        }
      });

      pageSizeTrigger.addEventListener("keydown", (event) => {
        if (!["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        pageSizeTrigger.click();
      });

      pageSizeOptions.forEach((option) => {
        option.addEventListener("keydown", (event) => {
          if (!["Enter", " "].includes(event.key)) return;
          event.preventDefault();
          option.click();
        });
      });

      prevPageButton.addEventListener("click", () => {
        currentPage = Math.max(1, currentPage - 1);
        renderVideoList(currentContentView);
        scrollContentListToTop();
        syncStickyDivider();
      });

      nextPageButton.addEventListener("click", () => {
        const totalPages = Math.max(1, Math.ceil(getVideoRows(currentContentView).length / pageSize));
        currentPage = Math.min(totalPages, currentPage + 1);
        renderVideoList(currentContentView);
        scrollContentListToTop();
        syncStickyDivider();
      });

      contentTabs.forEach((tab, index) => {
        tab.addEventListener("click", () => {
          setContentView(tab.dataset.contentTab);
        });
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight"].includes(event.key)) {
            return;
          }
          event.preventDefault();
          const offset = event.key === "ArrowRight" ? 1 : -1;
          const nextIndex = (index + offset + contentTabs.length) % contentTabs.length;
          contentTabs[nextIndex].focus();
          setContentView(contentTabs[nextIndex].dataset.contentTab);
        });
      });


      const reviewTooltip = document.createElement("div");
      reviewTooltip.id = "review-failure-tooltip";
      reviewTooltip.className = "review-tooltip";
      reviewTooltip.setAttribute("role", "tooltip");
      reviewTooltip.hidden = true;
      document.body.append(reviewTooltip);
      let reviewAnchor = null;
      let reviewOpenTimer = 0;
      let reviewCloseTimer = 0;
      function hideReviewTooltip() {
        clearTimeout(reviewOpenTimer); clearTimeout(reviewCloseTimer);
        reviewAnchor?.removeAttribute("aria-describedby");
        reviewAnchor = null; reviewTooltip.hidden = true;
      }
      function showReviewTooltip(anchor) {
        hideReviewTooltip(); reviewAnchor = anchor;
        reviewOpenTimer = setTimeout(() => {
          if (!anchor.isConnected) return;
          reviewTooltip.textContent = t(anchor.dataset.reviewReason);
          reviewTooltip.hidden = false;
          anchor.setAttribute("aria-describedby", reviewTooltip.id);
          const rect = anchor.getBoundingClientRect();
          const tip = reviewTooltip.getBoundingClientRect();
          const left = Math.max(8, Math.min(innerWidth - tip.width - 8, rect.left + rect.width / 2 - tip.width / 2));
          const above = rect.top >= tip.height + 16;
          reviewTooltip.dataset.placement = above ? "top" : "bottom";
          reviewTooltip.style.left = `${left}px`;
          reviewTooltip.style.top = `${above ? rect.top - tip.height - 8 : rect.bottom + 8}px`;
          reviewTooltip.style.setProperty("--arrow-left", `${Math.max(8, Math.min(tip.width - 8, rect.left + rect.width / 2 - left))}px`);
        }, 100);
      }
      function closeReviewTooltipSoon() { clearTimeout(reviewOpenTimer); reviewCloseTimer = setTimeout(hideReviewTooltip, 100); }
      contentList.addEventListener("mouseover", event => { const anchor = event.target.closest("[data-review-reason]"); if (anchor && !anchor.contains(event.relatedTarget)) showReviewTooltip(anchor); });
      contentList.addEventListener("mouseout", event => { const anchor = event.target.closest("[data-review-reason]"); if (anchor && !anchor.contains(event.relatedTarget)) closeReviewTooltipSoon(); });
      contentList.addEventListener("focusin", event => { const anchor = event.target.closest("[data-review-reason]"); if (anchor) showReviewTooltip(anchor); });
      contentList.addEventListener("focusout", event => { if (event.target.closest("[data-review-reason]")) closeReviewTooltipSoon(); });
      reviewTooltip.addEventListener("mouseenter", () => clearTimeout(reviewCloseTimer));
      reviewTooltip.addEventListener("mouseleave", closeReviewTooltipSoon);
      document.addEventListener("keydown", event => { if (event.key === "Escape") hideReviewTooltip(); });
      window.addEventListener("scroll", () => {
        const anchor = reviewAnchor || contentList.querySelector("[data-review-reason]:hover, [data-review-reason]:focus");
        if (anchor && (anchor.matches(":hover") || anchor === document.activeElement)) {
          const rect = anchor.getBoundingClientRect();
          if (rect.bottom > 0 && rect.top < innerHeight && rect.right > 0 && rect.left < innerWidth) {
            showReviewTooltip(anchor);
            return;
          }
        }
        hideReviewTooltip();
      }, true);
      window.addEventListener("resize", hideReviewTooltip);

      syncSearchClear();
      setContentView("short");
      syncThemePreference();
      setLanguage(localStorage.getItem("studio-language") || "en");
    </script>
  </body>
</html>
